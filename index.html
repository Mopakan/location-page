!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اشتراک موقعیت مکانی</title>
</head>

<body>

  <h2>اشتراک موقعیت مکانی</h2>

  <p>
    موقعیت مکانی شما دریافت می‌شود.
    سپس از شما برای ارسال آن به صاحب این صفحه اجازه گرفته می‌شود.
  </p>

  <p id="result">در حال آماده‌سازی...</p>

  <hr>

  <button onclick="showLocationInfo()">نمایش موقعیت، تاریخ و ساعت</button>

  <p id="infoResult"></p>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyOkaPgf6DbIk9xnIpk_GyyE1fIDTxayLrJvztmbkALjXuBdCTvYwwPo9I6fZD_Q9uYeQ/exec";

    function getLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.innerText =
          "مرورگر شما از موقعیت مکانی پشتیبانی نمی‌کند.";
        return;
      }

      result.innerText = "در حال دریافت موقعیت...";

      navigator.geolocation.getCurrentPosition(
        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

        

          result.innerText = "در حال ارسال موقعیت...";

          fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              latitude: lat,
              longitude: lon
            })
          })
          .then(response => response.text())
          .then(data => {

            const now = new Date();
            const dateStr = now.toLocaleDateString("fa-IR");
            const timeStr = now.toLocaleTimeString("fa-IR");

            result.innerHTML =
              "موقعیت با موفقیت ارسال شد.<br><br>" +
              "عرض جغرافیایی: " + lat + "<br>" +
              "طول جغرافیایی: " + lon + "<br>" +
              "تاریخ: " + dateStr + "<br>" +
              "ساعت: " + timeStr + "<br><br>" +
              '<a target="_blank" href="https://www.google.com/maps?q=' +
              encodeURIComponent(lat + "," + lon) +
              '">' +
              "باز کردن موقعیت در Google Maps" +
              "</a>";

          })
          .catch(error => {

            console.error("خطا:", error);

            result.innerText =
              "موقعیت دریافت شد، اما ارسال آن ناموفق بود.";

          });
        },

        function(error) {

          switch (error.code) {

            case error.PERMISSION_DENIED:
              result.innerText =
                "دسترسی به موقعیت مکانی رد شد.";
              break;

            case error.POSITION_UNAVAILABLE:
              result.innerText =
                "موقعیت مکانی در دسترس نیست.";
              break;

            case error.TIMEOUT:
              result.innerText =
                "دریافت موقعیت بیش از حد طول کشید.";
              break;

            default:
              result.innerText =
                "خطای نامشخص در دریافت موقعیت.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // این تابع فقط موقعیت فعلی، تاریخ و ساعت را نمایش می‌دهد
    // و هیچ داده‌ای به هیچ سروری ارسال نمی‌کند
    function showLocationInfo() {
      const infoResult = document.getElementById("infoResult");

      if (!navigator.geolocation) {
        infoResult.innerText =
          "مرورگر شما از موقعیت مکانی پشتیبانی نمی‌کند.";
        return;
      }

      infoResult.innerText = "در حال دریافت موقعیت...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          window.addEventListener("DOMContentLoaded", getLocation);
  </script>

</body>
</html>
